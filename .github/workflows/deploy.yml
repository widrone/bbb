name: Deploy site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the site before publishing
        run: |
          if find web -type f \( -iname '*.wav' -o -iname '*.aif*' -o -iname '*.flac' \) | grep -q .; then echo "Lossless masters in web/, remove them"; exit 1; fi
          big=$(find web -type f -size +50M); if [ -n "$big" ]; then echo "Files over 50 MB: $big"; exit 1; fi
          echo "{\"commit\":\"$GITHUB_SHA\",\"time\":\"$(date -u +%FT%TZ)\"}" > web/build.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
